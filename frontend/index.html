<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EventHub</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#eventSearch">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="text-center mb-5">
            <h1 class="display-5 fw-bold">Welcome to EventHub</h1>
            <p class="lead">Discover and manage university events in one place.</p>
            <a href="#eventSearch" class="btn btn-primary">Explore Events</a>
        </section>

        <section id="eventSearch" aria-labelledby="eventSearchHeading">
            <h2 id="eventSearchHeading" class="mb-3">Find events</h2>
            <form id="eventSearchForm" class="row g-2 mb-3">
                <div class="col">
                    <label for="eventSearchInput" class="visually-hidden">Search events</label>
                    <input
                        id="eventSearchInput"
                        class="form-control"
                        type="search"
                        placeholder="Search by event name, description, or category"
                        maxlength="100"
                    >
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" type="submit">Search</button>
                    <button
                        id="clearEventSearch"
                        class="btn btn-outline-secondary"
                        type="button"
                    >Clear</button>
                </div>
            </form>
            <p id="eventSearchLoading" class="d-none" role="status">Loading events…</p>
            <div class="d-flex justify-content-between align-items-center gap-2">
                <p id="eventSearchError" class="alert alert-danger d-none flex-grow-1" role="alert"></p>
                <button id="retryEventSearch" class="btn btn-outline-danger d-none" type="button">Retry</button>
            </div>
            <p id="eventSearchEmpty" class="d-none" role="status">No upcoming events found. Please check again later.</p>
            <div id="eventSearchResults" class="row g-3" aria-live="polite"></div>
        </section>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="js/events.js"></script>
</body>
</html>
