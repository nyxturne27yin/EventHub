
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification History | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EventHub</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link active" aria-current="page"
                   href="notification-history.html">Notifications</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Notification History</h1>
                <p class="text-muted mb-0">Your event updates and registration notifications.</p>
            </div>
            <button id="refreshNotifications" class="btn btn-outline-primary mt-2">
                Refresh
            </button>
        </div>

        <div id="notificationLoading" class="text-center py-5" role="status">
            <div class="spinner-border text-primary" aria-hidden="true"></div>
            <p class="text-muted mt-2">Loading notifications...</p>
        </div>

        <div id="notificationError" class="alert alert-danger d-none" role="alert">
            <span id="notificationErrorMessage">Unable to load notifications.</span>
            <button id="retryNotifications" class="btn btn-sm btn-outline-danger ms-2">
                Try again
            </button>
        </div>

        <div id="notificationEmpty" class="text-center border rounded p-5 d-none">
            <h2 class="h5">No notifications yet</h2>
            <p class="text-muted mb-0">
                Your event updates and registration notifications will appear here.
            </p>
        </div>

        <div id="notificationList" class="d-flex flex-column gap-3"
             aria-live="polite"></div>
    </main>

    <script src="js/notification-history.js"></script>
</body>
</html>
