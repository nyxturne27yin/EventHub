
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EventHub</a>
            <a href="login.html">Back to login</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 mb-3">Forgot your password?</h1>
                        <p class="text-secondary">
                            Enter your registered email. If an eligible account exists,
                            we will send instructions to reset your password.
                        </p>

                        <form id="forgotForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">UAP Email</label>
                                <input
                                    id="email"
                                    name="email"
                                    type="email"
                                    class="form-control"
                                    maxlength="255"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div id="message" class="alert d-none"
                                 role="status" aria-live="polite"></div>

                            <button id="submitButton" type="submit"
                                    class="btn btn-primary w-100">
                                Send reset link
                            </button>
                        </form>

                        <p class="mt-3 mb-0 text-center">
                            <a href="login.html">Return to login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/forgot-password.js"></script>
</body>
</html>
