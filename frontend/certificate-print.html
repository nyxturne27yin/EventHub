<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f5f8; }
        .certificate {
            max-width: 950px;
            margin: 35px auto;
            padding: 45px;
            background: white;
            border: 10px double #23466b;
            text-align: center;
            min-height: 600px;
        }
        .certificate h1 {
            color: #23466b;
            letter-spacing: 3px;
            font-family: Georgia, serif;
        }
        .student-name {
            font-family: Georgia, serif;
            font-size: 2.4rem;
            color: #173b60;
            border-bottom: 1px solid #aaa;
            display: inline-block;
            padding: 8px 35px;
        }
        .qr-image { width: 125px; height: 125px; object-fit: contain; }
        .certificate-id { overflow-wrap: anywhere; }
        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background: white; }
            .no-print { display: none !important; }
            .certificate {
                margin: 0 auto;
                max-width: none;
                min-height: 0;
                height: 180mm;
                box-shadow: none;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="container text-center py-3 no-print">
        <button class="btn btn-primary" id="printButton" type="button">
            Print / Save as PDF
        </button>
        <a href="profile.html" class="btn btn-outline-secondary">Back to Profile</a>
    </div>

    <div id="certificateError" class="alert alert-danger container d-none" role="alert"></div>

    <main id="certificate" class="certificate">
        <p class="text-uppercase fw-bold text-secondary">EventHub</p>
        <h1 class="display-4 fw-bold">CERTIFICATE</h1>
        <h2 class="h4 text-secondary mt-2">OF REGISTRATION</h2>
        <p class="mt-5 fs-5">This certificate is proudly presented to</p>
        <div id="studentName" class="student-name">Loading...</div>
        <p class="mt-4 fs-5">This certifies that the above-named student is registered for</p>
        <h2 id="eventTitle" class="h2 mt-3">Loading event...</h2>
        <p class="mt-3">Category: <strong id="category">—</strong></p>
        <p>Issued on: <strong id="issuedDate">—</strong></p>

        <div class="d-flex justify-content-around align-items-end mt-5 flex-wrap gap-4">
            <div>
                <div class="border-top border-dark px-4 pt-2">EventHub Organizer</div>
            </div>
            <div>
                <img id="qrImage" class="qr-image" alt="Certificate verification QR code">
                <div class="small text-secondary">Scan to verify</div>
            </div>
        </div>

        <p id="certificateId" class="small text-muted certificate-id mt-4"></p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/certificate-print.js"></script>
</body>
</html>
