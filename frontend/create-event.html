<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Event - EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">EventHub</a>
            <a class="btn btn-outline-light btn-sm" href="index.html">Back to Home</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 850px;">
            <div class="card-body p-4">
                <h2 class="mb-2">Create an Event</h2>
                <p class="text-muted">Fill in the details to create your event.</p>

                <div id="pageMessage" class="alert d-none" role="alert"></div>

                <form id="createEventForm" class="d-none">
                    <div class="mb-3">
                        <label for="title" class="form-label">Event Title</label>
                        <input id="title" name="title" class="form-control" maxlength="200" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input id="category" name="category" class="form-control" maxlength="100" placeholder="e.g. Workshop, Seminar, Competition" required>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="event_date" class="form-label">Event Date</label>
                            <input type="date" id="event_date" name="event_date" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="start_time" class="form-label">Start Time</label>
                            <input type="time" id="start_time" name="start_time" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="end_time" class="form-label">End Time</label>
                            <input type="time" id="end_time" name="end_time" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="mode" class="form-label">Event Mode</label>
                            <select id="mode" name="mode" class="form-select" required>
                                <option value="Offline">Offline</option>
                                <option value="Online">Online</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="capacity" class="form-label">Participant Capacity</label>
                            <input type="number" id="capacity" name="capacity" class="form-control" min="1" step="1" required>
                        </div>
                    </div>

                    <div id="venueGroup" class="mb-3">
                        <label for="venue" class="form-label">Venue</label>
                        <input id="venue" name="venue" class="form-control" maxlength="255" placeholder="Enter event location">
                    </div>

                    <div id="meetingLinkGroup" class="mb-3 d-none">
                        <label for="meeting_link" class="form-label">Meeting Link</label>
                        <input type="url" id="meeting_link" name="meeting_link" class="form-control" maxlength="500" placeholder="https://...">
                    </div>

                    <div class="mb-3">
                        <label for="registration_deadline" class="form-label">Registration Deadline</label>
                        <input type="datetime-local" id="registration_deadline" name="registration_deadline" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label">Event Status</label>
                        <select id="status" name="status" class="form-select" required>
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>

                    <button id="submitButton" type="submit" class="btn btn-primary">Create Event</button>
                    <a href="index.html" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </main>

    <script src="js/create-event.js"></script>
</body>
</html>
