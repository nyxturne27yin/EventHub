<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EventHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventHub</a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Events</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="register.html">Register</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="profile.html">Profile</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="mb-4">
                <h1 class="h2">My Profile</h1>
                <p class="text-muted">
                    View your EventHub account information.
                </p>
            </div>

            <div id="profileLoading" class="text-center py-4">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading profile...</p>
            </div>

            <div
                id="profileError"
                class="alert alert-danger d-none"
                role="alert"
            ></div>

            <div id="profileContent" class="d-none">

                <div class="card shadow-sm mb-4">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="h4 mb-0">Account Information</h2>

                            <button
                                type="button"
                                class="btn btn-outline-primary"
                                id="editProfileBtn"
                            >
                                Edit Profile
                            </button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Name</label>
                            <p id="profileName" class="mb-0">-</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <p id="profileEmail" class="mb-0">-</p>
                        </div>

                        <div>
                            <label class="form-label fw-bold">Role</label>
                            <p id="profileRole" class="mb-0">-</p>
                        </div>

                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">

                        <h2 class="h4">Certificates</h2>

                        <p class="text-muted mb-0">
                            No certificates are available yet.
                        </p>

                    </div>
                </div>

            </div>

        </div>
    </div>

</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/app.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
