<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container py-5" style="max-width: 500px;">
        <h1 class="mb-4">EventHub Login</h1>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">UAP Email</label>
                <input id="email" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control" required>
            </div>
            <div id="loginError" class="alert alert-danger d-none"></div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3"><a href="register.html">Create an account</a></p>
        <p><a href="profile.html">Go to Profile</a></p>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
