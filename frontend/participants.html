<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event participants | EventHub</title>
    <meta name="description" content="Review event participants and manage registration status.">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EventHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#participantsNavigation" aria-controls="participantsNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="participantsNavigation">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html#eventSearch">Discover events</a>
                    <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                    <a class="nav-link" href="profile.html">Profile</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="mx-auto" style="max-width: 900px;">
            <h1 class="h2">Event Participants</h1>
            <p class="text-muted">
                View the participants registered for this event.
            </p>

            <div id="participantsLoading" class="text-secondary py-4" role="status" aria-live="polite"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading participants…</div>

            <div
                id="participantsError"
                class="alert alert-danger d-none"
                role="alert"
                aria-live="polite"
            ></div>
            <button id="participantsRetry" class="btn btn-outline-primary d-none mb-3" type="button">Try again</button>

            <div id="participantsEmpty" class="alert alert-secondary d-none">
                No participants have registered for this event yet.
            </div>

            <div id="participantsList" class="card d-none">
                <div class="card-header">
                    <h2 class="h5 mb-0">Participants</h2>
                </div>
                <ul id="participantItems" class="list-group list-group-flush"></ul>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/participants.js"></script>
</body>
</html>
