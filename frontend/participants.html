<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Participants - EventHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">EventHub</a>
            <a class="nav-link text-white" href="profile.html">Profile</a>
        </div>
    </nav>

    <main class="container py-5">
        <section class="mx-auto" style="max-width: 900px;">
            <h1 class="h2">Event Participants</h1>
            <p class="text-muted">
                View the participants registered for this event.
            </p>

            <div id="participantsLoading" class="alert alert-info" role="status">
                Participant data will appear here once connected to event registration.
            </div>

            <div
                id="participantsError"
                class="alert alert-danger d-none"
                role="alert"
            ></div>

            <div id="participantsEmpty" class="alert alert-secondary d-none">
                No participants have registered for this event yet.
            </div>

            <div id="participantsList" class="card d-none">
                <div class="card-header">
                    <h2 class="h5 mb-0">Participants</h2>
                </div>
                <ul id="participantItems" class="list-group list-group-flush"></ul>
            </div>
        </section>
    </main>
    <script src="js/participants.js"></script>
</body>
</html>
